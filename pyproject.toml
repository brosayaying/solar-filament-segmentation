[project]
name = "solar-filament"
version = "0.1.0"
description = "Solar filament segmentation for the MAGFiLO Kaggle 2026 challenge"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pycocotools>=2.0.7",
    "scipy>=1.11",
    "pillow>=10.0",
    "tqdm>=4.66",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
